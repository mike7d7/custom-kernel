name: Publish Nix Binary Cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: |
          nix build .#default

      - name: Export cache
        env:
          PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
        run: |
          mkdir pages
          mkdir release

          printf '%s\n' "$PRIVATE_KEY" > cache.key

          nix copy \
            --to "file://$PWD/export?secret-key=$PWD/cache.key&compression=xz" \
            $(nix path-info .#default)

          cat > pages/nix-cache-info <<EOF
          StoreDir: /nix/store
          WantMassQuery: 1
          Priority: 30
          EOF

          BASE="https://github.com/${{ github.repository }}/releases/download/nix-cache"

          shopt -s nullglob

          for f in export/*.narinfo; do
              cp "$f" pages/

              nar=$(awk '/^URL:/ {print $2}' "$f")

              narfile=$(basename "$nar")

              sed -i \
                "s|^URL:.*|URL: ${BASE}/${narfile}|" \
                "pages/$(basename "$f")"
          done

          mv export/*.nar* release/

      #
      # Replace release
      #

      - name: Delete previous release
        continue-on-error: true
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          tag_name: nix-cache
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nix-cache
          name: Nix Binary Cache
          make_latest: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #
      # Publish Pages
      #

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - uses: actions/deploy-pages@v4
