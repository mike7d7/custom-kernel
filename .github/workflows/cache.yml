name: Deploy Cache

on:
  workflow_dispatch: 
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: randymarsh77/static-nix-cache/setup@master

      - name: Build kernel (all outputs)
        run: nix build '.#default^*' --print-out-paths > /tmp/output-paths.txt

      - name: Generate paths file
        run: nix path-info -r $(cat /tmp/output-paths.txt) > /tmp/paths.txt

      - name: Sign store paths
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$NIX_SIGNING_KEY" > /tmp/cache-key
          chmod 600 /tmp/cache-key

          while IFS= read -r path; do
            echo "Signing: $path"
            nix store sign \
              --key-file /tmp/cache-key \
              "$path"
          done < /tmp/paths.txt
          
      - name: Cache Nix Binaries
        uses: randymarsh77/static-nix-cache/save@v1
        with:
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
            
      - uses: randymarsh77/static-nix-cache/deploy@master
        with:
          paths-file: /tmp/paths.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          static: ./site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - uses: actions/deploy-pages@v4
        id: pages
