name: Build and Publish Nix Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ---> NEW STEP: Magic Nix Cache <---
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          diagnostic-endpoint: ""

      - name: Build Flake
        run: nix build .#default

      - name: Export and Compress Cache
        run: |
          mkdir -p /tmp/nix-cache
          
          # Write the secret key
          echo "${{ secrets.NIX_CACHE_PRIVATE_KEY }}" > /tmp/secret-key-file
          
          # Export the built result AND its dependencies to a file-based cache
          # This signs the paths with your secret key
          nix copy --to file:///tmp/nix-cache?secret-key-file=/tmp/secret-key-file $(readlink -f result)
          
          tar -czf nix-cache.tar.gz -C /tmp nix-cache

      - name: Delete previous release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          tag_name: nix-cache
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nix-cache
          name: Nix Binary Cache
          files: nix-cache.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
