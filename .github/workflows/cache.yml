name: Deploy Cache

on:
  workflow_dispatch: 
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: randymarsh77/static-nix-cache/setup@master

      - name: Build kernel (all outputs)
        run: nix build '.#default^*' --print-out-paths > /tmp/output-paths.txt

      - name: Generate paths file
        run: nix path-info -r $(cat /tmp/output-paths.txt) > /tmp/paths.txt
            
      - uses: randymarsh77/static-nix-cache/deploy@master
        with:
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          paths-file: /tmp/paths.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          static: ./site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - uses: actions/deploy-pages@v4
        id: pages
